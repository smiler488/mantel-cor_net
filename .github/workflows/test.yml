name: test
on: [push, pull_request]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("ggplot2", "vegan", "ggnewscale", "svglite"))'
      - run: Rscript tests/check_outputs.R
      - name: keep the rendered figure
        run: Rscript cor_mantel_overlay.R demo.csv figure
      - uses: actions/upload-artifact@v4
        with:
          name: demo-figure
          path: figure.*
